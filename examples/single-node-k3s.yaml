apiVersion: ironkube.io/v1alpha1
kind: Cluster
metadata:
  name: dev-cluster
spec:
  distro: k3s
  version: v1.34.3+k3s1
  controlPlane:
    replicas: 1
    nodes:
      - host: 10.0.0.1
        user: root
  security:
    profile: minimal
  networking:
    cni: flannel
    podCIDR: 10.42.0.0/16
    serviceCIDR: 10.43.0.0/16
