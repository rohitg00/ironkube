<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iron-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="45%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="iron-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="forge-spoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="inner-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <polygon points="256,38 444,147 444,365 256,474 68,365 68,147"
           fill="url(#iron-body)" stroke="url(#iron-edge)" stroke-width="3"
           stroke-linejoin="round" filter="url(#shadow)"/>

  <polygon points="256,38 444,147 444,365 256,474 68,365 68,147"
           fill="url(#inner-glow)"/>

  <polygon points="256,62 422,160 422,352 256,450 90,352 90,160"
           fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

  <g stroke="url(#forge-spoke)" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="256" y2="161"/>
    <line x1="256" y1="256" x2="330" y2="197"/>
    <line x1="256" y1="256" x2="349" y2="277"/>
    <line x1="256" y1="256" x2="297" y2="342"/>
    <line x1="256" y1="256" x2="215" y2="342"/>
    <line x1="256" y1="256" x2="163" y2="277"/>
    <line x1="256" y1="256" x2="182" y2="197"/>
  </g>

  <circle cx="256" cy="256" r="98" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>

  <g fill="url(#forge)">
    <circle cx="256" cy="161" r="14"/>
    <circle cx="330" cy="197" r="14"/>
    <circle cx="349" cy="277" r="14"/>
    <circle cx="297" cy="342" r="14"/>
    <circle cx="215" cy="342" r="14"/>
    <circle cx="163" cy="277" r="14"/>
    <circle cx="182" cy="197" r="14"/>
  </g>

  <circle cx="256" cy="256" r="30" fill="url(#forge)"/>
  <circle cx="256" cy="256" r="19" fill="#2d3748"/>
  <circle cx="256" cy="256" r="9" fill="#fbbf24"/>
</svg>
