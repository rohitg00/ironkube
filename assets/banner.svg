  <text x="310" y="155" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#f8fafc" letter-spacing="-1">Iron</text>
  <text x="484" y="155" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#f59e0b" letter-spacing="-1">Kube</text>

  <text x="310" y="195" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" fill="#94a3b8" letter-spacing="0.5">Unified Kubernetes lifecycle management</text>

  <text x="310" y="230" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" letter-spacing="0.3">Day 0 through Day 2  ·  No management cluster  ·  One binary, any distro, any infrastructure</text>

  <rect x="310" y="256" width="70" height="26" rx="4" fill="#1e3a5f" opacity="0.8"/>
