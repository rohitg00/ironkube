  <rect x="492" y="256" width="100" height="26" rx="4" fill="#1e3a5f" opacity="0.8"/>
  <text x="501" y="274" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#60a5fa" letter-spacing="0.3">Apache-2.0</text>

  <rect x="604" y="256" width="110" height="26" rx="4" fill="#1e3a5f" opacity="0.8"/>
  <text x="613" y="274" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#60a5fa" letter-spacing="0.3">4 distros</text>

  <rect x="726" y="256" width="130" height="26" rx="4" fill="#1e3a5f" opacity="0.8"/>
  <text x="735" y="274" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#60a5fa" letter-spacing="0.3">3 infra providers</text>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#accent-line)" stroke-width="2"/>

