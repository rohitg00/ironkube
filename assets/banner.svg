    <linearGradient id="grid-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" stop-opacity="0"/>
      <stop offset="30%" stop-color="#334155" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

